<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Alunos - Grid Dinâmico</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <header class="topo">
            <div>
                <h1>Cadastro de Alunos</h1>
                <p class="subtitulo">Cursos e alunos: um curso tem vários alunos (1:N). A lista de alunos carrega ao rolar a tela.</p>
            </div>
            <div class="filtros">
                <button type="button" id="btn-tema" class="btn btn-secundario" title="Alternar tema claro/escuro">
                    🌙
                </button>
                <button type="button" id="btn-novo" class="btn btn-primario">
                    + Novo aluno
                </button>
            </div>
        </header>

        <div id="msg" class="msg" hidden></div>

        <section class="painel">
            <div class="painel-cabecalho">
                <h2>Cursos</h2>
                <form id="form-curso" class="form-linha">
                    <input id="novo-curso" type="text" placeholder="Nome do novo curso" required />
                    <button type="submit" class="btn btn-primario">Adicionar curso</button>
                </form>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Curso</th>
                        <th>Alunos</th>
                        <th class="acoes">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-cursos">
                    <tr>
                        <td colspan="3" class="vazio">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="painel">
            <div class="painel-cabecalho">
                <h2>Alunos cadastrados</h2>
                <div class="filtros">
                    <select id="filtro-curso">
                        <option value="">Todos os cursos</option>
                    </select>
                    <button type="button" id="btn-atualizar" class="btn btn-secundario">Atualizar lista</button>
                </div>
            </div>
            <form id="form-busca" class="busca-linha">
                <input id="busca-aluno" type="search" placeholder="Pesquisar por nome ou RA" />
                <button type="submit" class="btn btn-primario">Pesquisar</button>
            </form>
            <div id="filtros-ativos" class="filtros-ativos" hidden></div>
            <table>
                <thead>
                    <tr>
                        <th>
                            <button type="button" class="th-ordem" data-ordem="nome" title="Ordenar por nome">
                                Nome <span class="seta-ordem" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th>
                            <button type="button" class="th-ordem" data-ordem="ra" title="Ordenar por RA">
                                RA <span class="seta-ordem" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th>
                            <button type="button" class="th-ordem" data-ordem="curso" title="Ordenar por curso">
                                Curso <span class="seta-ordem" aria-hidden="true"></span>
                            </button>
                        </th>
                        <th class="acoes">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-alunos">
                    <tr>
                        <td colspan="4" class="vazio">Carregando...</td>
                    </tr>
                </tbody>
            </table>
            <p id="alunos-status" class="rolagem-status">Carregando...</p>
            <div id="sentinela-alunos" aria-hidden="true"></div>
        </section>

        <div id="modal" class="modal" hidden>
            <div class="modal-fundo" id="modal-fundo"></div>
            <div class="modal-caixa" role="dialog" aria-modal="true">
                <h2 id="modal-titulo">Novo aluno</h2>
                <form id="form-aluno">
                    <label>
                        Nome
                        <input id="nome" type="text" required autocomplete="off" />
                    </label>
                    <label>
                        RA
                        <input id="ra" type="text" required autocomplete="off" />
                    </label>
                    <label>
                        Curso
                        <select id="curso" required>
                            <option value="">Selecione um curso</option>
                        </select>
                    </label>
                    <div class="modal-acoes">
                        <button type="button" id="btn-cancelar" class="btn btn-secundario">Cancelar</button>
                        <button type="submit" class="btn btn-primario">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
